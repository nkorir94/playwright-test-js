name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test --reporter=list,json --output=test-results

      # Upload artifacts (HTML reports)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  update-readme:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Extract summary data
        run: |
          echo "Extracting summary from test-results.json"
          PASSED=$(jq '[.suites[].specs[].tests[] | select(.results[].status=="passed")] | length' test-results/test-results.json)
          FAILED=$(jq '[.suites[].specs[].tests[] | select(.results[].status=="failed")] | length' test-results/test-results.json)
          TOTAL=$((PASSED+FAILED))
          echo "✅ $PASSED passed, ❌ $FAILED failed" > summary.txt
          echo "Total tests: $TOTAL" >> summary.txt

      - name: Update README with results
        run: |
          sed -i '/<!--TEST_SUMMARY_START-->/,<!--TEST_SUMMARY_END-->/c\<!--TEST_SUMMARY_START-->\n'"$(cat summary.txt)"'\n<!--TEST_SUMMARY_END-->' README.md

      - name: Commit and push update
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update test summary [skip ci]" || echo "No changes to commit"
          git push
